name: Worker Authorization Tests

on:
  push:
    branches: [foundation/phase-0]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        working-directory: worker
        run: npm run check
      - name: Unit tests
        working-directory: worker
        run: npm test
